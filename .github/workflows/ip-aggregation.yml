name: Generate Multi-Country Blocklists

#-------------------------------------------------------------------#
##  ##  ##          DONT FORGET TO CHANGE:                 ##  ##  ## 
##  ##  ##    settings > actions > workflow permissions    ##  ##  ##
##  ##  ##    Set to "Read and write permissions"          ##  ##  ##
#-------------------------------------------------------------------#

permissions:
  contents: write
  actions: read

on:
  # Scheduled runs - daily at 2:17 AM and 2:17 PM UTC (using prime number)
  schedule:
     #        ┌───────────── minute (0 - 59)
     #        │ ┌───────────── hour (0 - 23)
     #        │ │ ┌───────────── day of month (1 - 31)
     #        │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
     #        │ │ │ │ ┌───────────── day of week (0 - 6) (SUN-SAT, 0 = SUN)
     #        │ │ │ │ │
     #        * * * * *
    - cron: "17 */8 * * *"
     # Scheduled run above - daily at 2:17 AM and 2:17 PM (using prime number for odd min time)
     #  cron: "37 13 * * 6"
     # Example run above - Saturday at 13:37 UTC (7:37am MDT, once a week, on Sunday)
     #  cron: "7 6 */2 * *"
     # Example run above - Every other day at 6:07am UTC (days of the month divisible by 2, even days)

  # Trigger on .env file changes
  push:
    paths:
      - '.env'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'filter_ips.py'
      - 'run.sh'
      - '.github/workflows/ip-aggregation.yml'
    branches: [ "main", "master" ]
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes'
        required: false
        default: 'false'
        type: boolean

env:
  TZ: UTC

jobs:
  aggregate-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          mkdir -p data/input data/output data/geoip
          
          echo "=== Repository Structure ==="
          ls -la
          
          echo "=== Environment File ==="
          cat .env

      - name: Build Docker image
        run: |
          echo "=== Building Docker Image ==="
          docker build --tag ip-aggregator:latest .

      - name: Run IP aggregation
        run: |
          echo "=== Starting IP Aggregation Process ==="
          docker compose up --build
          echo "=== Process Complete ==="

      - name: Verify VyOS blacklist
        run: |
          echo "=== VyOS Blacklist ==="

          if [ ! -f "data/output/aggregated-vyos.txt" ]; then
            echo "❌ aggregated-vyos.txt was not generated!"
            exit 1
          fi

          COUNT=$(wc -l < data/output/aggregated-vyos.txt)

          echo "✅ VyOS blacklist generated"
          echo "Entries: $COUNT"

          echo ""
          echo "First 20 entries:"
          head -20 data/output/aggregated-vyos.txt

          echo ""
          echo "File size:"
          du -h data/output/aggregated-vyos.txt

      - name: Commit and push changes
        run: |
          echo "=== Committing Results ==="

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add data/output/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TOTAL_COUNT=$(wc -l < data/output/aggregated-vyos.txt)

            git commit -m "🤖 Automated IP blocklist update - $TOTAL_COUNT entries"
            git push

            echo "✅ Changes committed and pushed successfully"
          fi
