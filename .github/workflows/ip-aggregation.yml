name: Generate Multi-Country Blocklists

#-------------------------------------------------------------------#
##  ##  ##          DONT FORGET TO CHANGE:                 ##  ##  ##
##  ##  ##    settings > actions > workflow permissions    ##  ##  ##
##  ##  ##    Set to "Read and write permissions"          ##  ##  ##
#-------------------------------------------------------------------#

permissions:
  contents: write
  actions: read

on:
  # Scheduled runs - every 8 hours at 17 minutes past the hour
  schedule:
    - cron: "17 */8 * * *"

  # Trigger when configuration or processing files change
  push:
    paths:
      - '.env'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'filter_ips.py'
      - 'run.sh'
      - '.github/workflows/ip-aggregation.yml'
    branches: [ "main", "master" ]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no changes'
        required: false
        default: 'false'
        type: boolean

env:
  TZ: UTC

jobs:
  aggregate-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment
        run: |
          mkdir -p data/input data/output data/geoip

          echo "=== Repository Structure ==="
          ls -la

          echo "=== Environment File ==="
          cat .env

      - name: Build Docker image
        run: |
          echo "=== Building Docker Image ==="
          docker build --tag ip-aggregator:latest .

      - name: Run IP aggregation
        run: |
          echo "=== Starting IP Aggregation Process ==="
          docker compose up --build
          echo "=== Process Complete ==="

      - name: Verify VyOS blacklists
        run: |
          echo "=== VyOS Blacklists ==="

          # ---------------------------------------------------------
          # IPv4
          # ---------------------------------------------------------

          if [ ! -f "data/output/aggregated-vyos.txt" ]; then
            echo "❌ aggregated-vyos.txt was not generated!"
            exit 1
          fi

          IPV4_COUNT=$(wc -l < data/output/aggregated-vyos.txt)

          echo ""
          echo "✅ IPv4 blacklist generated"
          echo "Entries: $IPV4_COUNT"

          echo ""
          echo "First 20 IPv4 entries:"
          head -20 data/output/aggregated-vyos.txt

          echo ""
          echo "IPv4 file size:"
          du -h data/output/aggregated-vyos.txt

          # ---------------------------------------------------------
          # IPv6
          # ---------------------------------------------------------

          if [ ! -f "data/output/aggregated-vyos-ipv6.txt" ]; then
            echo "❌ aggregated-vyos-ipv6.txt was not generated!"
            exit 1
          fi

          IPV6_COUNT=$(wc -l < data/output/aggregated-vyos-ipv6.txt)

          echo ""
          echo "✅ IPv6 blacklist generated"
          echo "Entries: $IPV6_COUNT"

          echo ""
          echo "First 20 IPv6 entries:"
          head -20 data/output/aggregated-vyos-ipv6.txt

          echo ""
          echo "IPv6 file size:"
          du -h data/output/aggregated-vyos-ipv6.txt

          # ---------------------------------------------------------
          # Summary
          # ---------------------------------------------------------

          echo ""
          echo "========================================"
          echo "Blacklist generation successful"
          echo "========================================"
          echo "IPv4 entries: $IPV4_COUNT"
          echo "IPv6 entries: $IPV6_COUNT"
          echo "========================================"

      - name: Commit and push changes
        run: |
          echo "=== Committing Results ==="

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add data/output/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            IPV4_COUNT=$(wc -l < data/output/aggregated-vyos.txt)
            IPV6_COUNT=$(wc -l < data/output/aggregated-vyos-ipv6.txt)

            git commit -m "🤖 Automated IP blocklist update - IPv4: $IPV4_COUNT, IPv6: $IPV6_COUNT"

            git push

            echo "✅ Changes committed and pushed successfully"
          fi
